<svg xmlns="http://www.w3.org/2000/svg" width="400" height="424" viewBox="0 0 400 424" role="img" aria-labelledby="diagramTitle diagramDesc">
  <title id="diagramTitle">Four stages of the skill comparison pipeline</title>
  <desc id="diagramDesc">Group candidate skills by name, match related files and establish plausible order, compare changed operational evidence, and assess eleven risk indicators. All steps use stored data, not executed scripts.</desc>
  <rect width="400" height="424" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <!-- The full-width card and fixed icon column retain alignment when reduced to one report column. -->
    <rect x="3" y="4" width="394" height="82" rx="7" fill="#f5f8fb" stroke="#b6c8d7" stroke-width="1"/>
    <rect x="3" y="4" width="6" height="82" rx="3" fill="#287da6"/>
    <circle cx="30" cy="44" r="14" fill="#287da6"/>
    <text x="30" y="49" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">1</text>
    <text x="54" y="29" font-size="17" font-weight="bold" fill="#203342">Group candidates</text>
    <text x="54" y="49" font-size="13.5" fill="#344b5b">Find skills with the same exact name.</text>
    <text x="54" y="67" font-size="13.5" fill="#344b5b">These are candidates, not proven copies.</text>

    <line x1="200" y1="87" x2="200" y2="105" stroke="#698396" stroke-width="1.4"/>
    <path d="M195.5 100.5 L200 106 L204.5 100.5" fill="none" stroke="#698396" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="3" y="108" width="394" height="82" rx="7" fill="#f5f8fb" stroke="#b6c8d7" stroke-width="1"/>
    <rect x="3" y="108" width="6" height="82" rx="3" fill="#287da6"/>
    <circle cx="30" cy="148" r="14" fill="#287da6"/>
    <text x="30" y="153" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">2</text>
    <text x="54" y="133" font-size="17" font-weight="bold" fill="#203342">Match and order</text>
    <text x="54" y="153" font-size="13.5" fill="#344b5b">Identify related content; infer a plausible</text>
    <text x="54" y="171" font-size="13.5" fill="#344b5b">earlier-to-later comparison direction.</text>

    <line x1="200" y1="191" x2="200" y2="209" stroke="#698396" stroke-width="1.4"/>
    <path d="M195.5 204.5 L200 210 L204.5 204.5" fill="none" stroke="#698396" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="3" y="212" width="394" height="82" rx="7" fill="#f5f8fb" stroke="#b6c8d7" stroke-width="1"/>
    <rect x="3" y="212" width="6" height="82" rx="3" fill="#287da6"/>
    <circle cx="30" cy="252" r="14" fill="#287da6"/>
    <text x="30" y="257" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">3</text>
    <text x="54" y="237" font-size="17" font-weight="bold" fill="#203342">Compare operations</text>
    <text x="54" y="257" font-size="13.5" fill="#344b5b">Detect and compare commands, network</text>
    <text x="54" y="275" font-size="13.5" fill="#344b5b">operations, and available sibling files.</text>

    <line x1="200" y1="295" x2="200" y2="313" stroke="#698396" stroke-width="1.4"/>
    <path d="M195.5 308.5 L200 314 L204.5 308.5" fill="none" stroke="#698396" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="3" y="316" width="394" height="82" rx="7" fill="#edf5f8" stroke="#a9c6d4" stroke-width="1"/>
    <rect x="3" y="316" width="6" height="82" rx="3" fill="#287da6"/>
    <circle cx="30" cy="356" r="14" fill="#287da6"/>
    <text x="30" y="361" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">4</text>
    <text x="54" y="341" font-size="17" font-weight="bold" fill="#203342">Assess risk indicators</text>
    <text x="54" y="361" font-size="13.5" fill="#344b5b">Check changed evidence against 11 defined</text>
    <text x="54" y="379" font-size="13.5" fill="#344b5b">indicators; report gaps and uncertainty.</text>

    <text x="200" y="415" text-anchor="middle" font-size="11.5" fill="#5e6d76">Static analysis only — no skill instructions are executed</text>
  </g>
</svg>
