# Sampling configuration read by family_picker.py.

[sampling]
# Number of distinct families to select, not artifacts per family.
sample_size = 10

# Leave empty to generate a fresh random seed and save it with the sample.
# Set an integer (for example, 580) to reproduce a selection against the same
# database and configuration. TOML requires quotes for an empty value.
seed = 123

# Percentages must total 100. Floor each group's quota, then allocate remaining
# slots by descending fractional remainder. Break ties in group order below.
allocation_method = "largest_remainder"

[eligibility]
# The fixed snapshot exclusion list is family_picker_exclusions.json beside this
# tool. All grouped artifacts in this snapshot were verified loadable; sampling
# reads counts and hashes only, without repeating content checks.
# Count unordered pairs within each exact family name, without a repository filter.
# A pair qualifies if its primary file_sha values differ, or if both derived
# sibling_content_sha values are non-null and differ.
min_usable_pairs = 1

# Group bounds are inclusive and use total artifact count per exact family name.
# Percentages are whole percentage values: 20 means 20%, not 0.20.
# Set a group's percentage to 0 to exclude it from the sample.
# Example: percentages 20, 60, 14, 5, and 1 allocate 10 families as
# 2, 6, 1, 1, and 0, or 100 families as 20, 60, 14, 5, and 1.

[[groups]]
name = "Low"
min_artifacts = 2
max_artifacts = 2
percentage = 20

[[groups]]
name = "Medium"
min_artifacts = 3
max_artifacts = 15
percentage = 60

[[groups]]
name = "Large"
min_artifacts = 16
max_artifacts = 100
percentage = 20

[[groups]]
name = "X-Large"
min_artifacts = 101
max_artifacts = 500
percentage = 0

[[groups]]
name = "Extreme"
min_artifacts = 501
# No max_artifacts means there is no upper bound.
percentage = 0
