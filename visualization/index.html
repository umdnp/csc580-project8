<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skill relationship explorer</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#181b20);--fg:light-dark(#202832,#e3e9f0);--border:light-dark(#d3dbe3,#48525e);--blue:light-dark(#216aab,#79baff);--orange:light-dark(#9b5b13,#eeba74);--purple:light-dark(#7951a8,#c3a5ee)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:24px}h1{font-size:24px;font-weight:600}h2{font-size:18px}button,input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:7px 10px;max-width:100%}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}label{display:flex;flex-direction:column;gap:4px;min-width:0}.controls,.legend,.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:14px 0}.controls label{flex:1 1 230px}.legend{font-size:13px}.line{display:inline-block;width:25px;border-top:2px solid var(--blue);vertical-align:middle;margin-right:6px}.chrono{border-color:var(--orange);border-top-style:dashed}.declared{border-color:var(--purple)}#graph{display:block;width:100%;height:560px;border:1px solid var(--border);touch-action:none}.edge{fill:none;stroke:var(--blue);stroke-width:1.4}.edge.chronology{stroke:var(--orange);stroke-dasharray:5 3}.edge.declared-source{stroke:var(--purple)}.node{fill:var(--bg);stroke:var(--fg);stroke-width:1.5}.node.selected{fill:var(--blue)}text{fill:var(--fg);font:13px system-ui}.muted{font-size:13px}#message{min-height:24px;overflow-wrap:anywhere}#neighbors{display:flex;gap:8px;flex-wrap:wrap}#edge-detail{overflow-wrap:anywhere;min-height:24px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px} @media(max-width:500px){main{padding:12px}#graph{height:450px}}
</style></head><body><main>
<h1>Inferred skill evolution</h1><p id="totals">Choose a generated family report.</p>
<div class="controls"><label>Report<select id="report"></select></label><button id="refresh">Refresh reports</button><label>Relationship cluster<select id="cluster"></select></label><label>View<select id="scope"><option value="local">Parents and children</option><option value="lineage">All ancestors and descendants</option><option value="cluster">Entire cluster</option></select></label><label>Artifact ID<input id="artifact" inputmode="numeric" placeholder="Artifact ID"></label><button id="locate">Locate</button></div>
<div id="message" role="status" aria-live="polite"></div>
<div class="legend"><span><i class="line"></i>Containment →</span><span><i class="line chrono"></i>Chronology →</span><span><i class="line declared"></i>Declared source →</span><span>Parent → child · inferred, not proven copying</span></div>
<div class="actions"><button id="fit">Fit</button><button id="plus" aria-label="Zoom in">+</button><button id="minus" aria-label="Zoom out">−</button><span id="visible"></span></div>
<svg id="graph" role="img" aria-label="Interactive inferred parent-child graph; equivalent artifact navigation is available in the controls and connection buttons below."><defs></defs><g id="marks"></g></svg>
<h2 id="selection">Artifact details</h2><p id="details"></p><div id="neighbors"></div><p id="edge-detail" aria-live="polite"></p><p id="limitations" class="muted"></p>
</main><script>
const $=s=>document.querySelector(s),graph=$('#graph'),marks=$('#marks');
let meta=null,data={nodes:[],edges:[]},nodes=new Map(),parents=new Map(),children=new Map(),selected=null,box=[0,0,800,560],fitBox=box,drag=null,request=0;
const ns='http://www.w3.org/2000/svg';function el(tag,a){let n=document.createElementNS(ns,tag);Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));return n}
for(let [basis,color] of [['containment','--blue'],['chronology','--orange'],['declared-source','--purple']]){let m=el('marker',{id:'arrow-'+basis,viewBox:'0 0 10 10',refX:10,refY:5,markerWidth:7,markerHeight:7,orient:'auto'});m.append(el('path',{d:'M0 0L10 5L0 10Z',fill:`var(${color})`}));graph.querySelector('defs').append(m)}
function msg(t){$('#message').textContent=t}
async function api(path){let r=await fetch('/api/'+path);let d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'Request failed');return d}
function route(){return 'reports/'+encodeURIComponent($('#report').value)}
function busy(v){for(let id of ['cluster','scope','artifact','locate','fit','plus','minus'])$('#'+id).disabled=v}
function clear(){meta=null;data={nodes:[],edges:[]};nodes.clear();parents.clear();children.clear();selected=null;marks.replaceChildren();$('#cluster').replaceChildren();$('#neighbors').replaceChildren();for(let id of ['totals','visible','details','limitations','edge-detail'])$('#'+id).textContent='';$('#selection').textContent='Artifact details';busy(true)}
async function reports(){const token=++request;clear();msg('Finding reports…');try{let d=await api('reports');if(token!==request)return;let old=$('#report').value;$('#report').replaceChildren();d.reports.forEach(f=>$('#report').add(new Option(f,f)));if(d.reports.includes(old))$('#report').value=old;if(!d.reports.length){msg('No JSON reports found. Generate a family report in work/ and refresh.');return}await loadReport()}catch(e){if(token===request)msg(e.message)}}
async function loadReport(){const token=++request;clear();msg('Loading and indexing report…');try{let result=await api(route()+'/summary');if(token!==request)return;meta=result;$('#totals').textContent=`${meta.total.toLocaleString()} artifacts reported · ${meta.directed.toLocaleString()} directed links · ${meta.ambiguous.toLocaleString()} ambiguous pairs`;meta.clusters.forEach(c=>$('#cluster').add(new Option(`Cluster ${c.id} · ${c.n} artifacts · ${c.e} directed links`,c.id)));$('#limitations').textContent=`${meta.referenced.toLocaleString()} artifact IDs appear in relationships. ${Math.max(0,meta.total-meta.referenced).toLocaleString()} additional reported artifacts have no individual IDs listed. Ambiguous pairs are counted separately and never assigned parent–child direction. Horizontal position represents inferred steps, not elapsed time. Drag to pan; use the zoom controls to inspect dense graphs.`;if(!meta.clusters.length){msg('This report has no listed relationships to draw.');return}await loadCluster()}catch(e){if(token===request)msg(e.message)}}
async function loadCluster(id=null){const token=++request;busy(true);marks.replaceChildren();msg('Loading cluster…');try{let result=await api(route()+'/clusters/'+$('#cluster').value);if(token!==request)return;data=result;nodes=new Map(data.nodes.map(n=>[n.id,n]));parents=new Map();children=new Map();for(let e of data.edges){if(!parents.has(e[1]))parents.set(e[1],[]);parents.get(e[1]).push(e);if(!children.has(e[0]))children.set(e[0],[]);children.get(e[0]).push(e)}const degree=n=>(parents.get(n.id)||[]).length+(children.get(n.id)||[]).length;selected=nodes.has(id)?id:[...data.nodes].sort((a,b)=>Math.abs(degree(a)-6)-Math.abs(degree(b)-6)||a.id-b.id)[0].id;busy(false);msg('');draw()}catch(e){if(token===request)msg(e.message)}}
async function locate(){let value=$('#artifact').value.trim();if(!/^\d+$/.test(value)){msg('Enter a numeric artifact ID.');return}let id=Number(value);if(nodes.has(id)){select(id);return}let token=++request;msg('Locating artifact…');try{let n=await api(route()+'/artifacts/'+id);if(token!==request)return;$('#cluster').value=n.c;await loadCluster(id)}catch(e){if(token===request)msg(e.message)}}
function select(id){selected=id;msg('');draw()}
function walk(map,index){let seen=new Set([selected]),queue=[selected];for(let i=0;i<queue.length;i++)for(let e of map.get(queue[i])||[])if(!seen.has(e[index])){seen.add(e[index]);queue.push(e[index])}return seen}
function setBox(b){box=b;graph.setAttribute('viewBox',b.join(' '));marks.querySelectorAll('text').forEach(t=>t.style.display=b[2]/Math.max(graph.clientWidth,320)<2?'':'none')}
function edgeText(e){return `${e[0]} → ${e[1]} · ${e[2]} · Jaccard ${e[3]??'unavailable'} · match delta ${e[4]??'unavailable'} · ${e[5]} · introduced capabilities: ${e[6].join(', ')||'none'}`}
function draw(){if(selected===null)return;$('#artifact').value=selected;let mode=$('#scope').value,ids=mode==='cluster'?new Set(nodes.keys()):mode==='lineage'?new Set([...walk(parents,0),...walk(children,1)]):new Set([selected,...(parents.get(selected)||[]).map(e=>e[0]),...(children.get(selected)||[]).map(e=>e[1])]);let edges=data.edges.filter(e=>ids.has(e[0])&&ids.has(e[1]));let indeg=new Map([...ids].map(id=>[id,0])),layer=new Map([...ids].map(id=>[id,0])),out=new Map();for(let e of edges){indeg.set(e[1],indeg.get(e[1])+1);if(!out.has(e[0]))out.set(e[0],[]);out.get(e[0]).push(e[1])}let queue=[...ids].filter(id=>!indeg.get(id));for(let i=0;i<queue.length;i++)for(let id of out.get(queue[i])||[]){layer.set(id,Math.max(layer.get(id),layer.get(queue[i])+1));indeg.set(id,indeg.get(id)-1);if(!indeg.get(id))queue.push(id)}let cyclic=queue.length<ids.size,cols=new Map();for(let id of ids){let l=layer.get(id);if(!cols.has(l))cols.set(l,[]);cols.get(l).push(id)}let height=Math.max(200,...[...cols.values()].map(a=>a.length*42+40)),pos=new Map();for(let [l,list] of [...cols].sort((a,b)=>a[0]-b[0])){let avg=id=>{let ps=(parents.get(id)||[]).map(e=>pos.get(e[0])).filter(Boolean);return ps.length?ps.reduce((s,p)=>s+p.y,0)/ps.length:id};list.sort((a,b)=>avg(a)-avg(b));list.forEach((id,i)=>pos.set(id,{x:80+l*220,y:(height-list.length*42)/2+i*42+20}))}marks.replaceChildren();for(let e of edges){let a=pos.get(e[0]),b=pos.get(e[1]),basis=['chronology','declared-source'].includes(e[2])?e[2]:'containment';let p=el('path',{d:`M${a.x+9},${a.y}C${(a.x+b.x)/2},${a.y} ${(a.x+b.x)/2},${b.y} ${b.x-10},${b.y}`,class:'edge '+basis,'marker-end':`url(#arrow-${basis})`});let title=el('title',{});title.textContent=edgeText(e);p.append(title);p.onclick=()=>$('#edge-detail').textContent=edgeText(e);marks.append(p)}for(let [id,p] of pos){let g=el('g',{}),title=el('title',{});title.textContent=`Artifact ${id}`;g.append(title,el('circle',{cx:p.x,cy:p.y,r:17,fill:'transparent'}),el('circle',{cx:p.x,cy:p.y,r:id===selected?9:6,class:'node'+(id===selected?' selected':'')}));let t=el('text',{x:p.x+13,y:p.y-10});t.textContent=id;g.append(t);g.style.cursor='pointer';g.onclick=()=>{if(!moved)select(id)};marks.append(g)}let w=Math.max(320,...[...pos.values()].map(p=>p.x+120)),h=height,aspect=graph.clientWidth/graph.clientHeight;if(w/h>aspect)h=w/aspect;else w=h*aspect;fitBox=[-20,(height-h)/2-20,w+40,h+40];setBox(fitBox);$('#visible').textContent=`${ids.size} visible artifacts · ${edges.length} links${cyclic?' · cycle detected; layout is not a tree':''}`;let ps=parents.get(selected)||[],cs=children.get(selected)||[];$('#selection').textContent=`Artifact ${selected}`;$('#details').textContent=`${ps.length} inferred parents · ${cs.length} inferred children · ${nodes.get(selected).amb.toLocaleString()} ambiguous connections · ${data.ambiguous.toLocaleString()} ambiguous pairs in this cluster`;$('#edge-detail').textContent='';let holder=$('#neighbors');holder.replaceChildren();if(ps.length+cs.length>16){let details=document.createElement('details'),summary=document.createElement('summary');summary.textContent='Browse all parent and child connections';details.append(summary);holder.append(details);holder=details}for(let [label,list,index] of [['Parent',ps,0],['Child',cs,1]])for(let e of list){let b=document.createElement('button');b.textContent=`${label} ${e[index]}`;b.title=edgeText(e);b.onclick=()=>{select(e[index]);$('#edge-detail').textContent=edgeText(e)};holder.append(b)}}
function zoom(f){let [x,y,w,h]=box;setBox([x+w*(1-f)/2,y+h*(1-f)/2,w*f,h*f])}$('#fit').onclick=()=>setBox(fitBox);$('#plus').onclick=()=>zoom(.7);$('#minus').onclick=()=>zoom(1/.7);$('#report').onchange=loadReport;$('#refresh').onclick=reports;$('#cluster').onchange=()=>loadCluster();$('#scope').onchange=draw;$('#locate').onclick=locate;$('#artifact').onkeydown=e=>{if(e.key==='Enter')locate()};let moved=false;graph.onpointerdown=e=>{moved=false;drag={x:e.clientX,y:e.clientY,b:[...box]};};graph.onpointermove=e=>{if(!drag)return;if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4){moved=true;graph.setPointerCapture(e.pointerId)}let r=graph.getBoundingClientRect();setBox([drag.b[0]-(e.clientX-drag.x)*box[2]/r.width,drag.b[1]-(e.clientY-drag.y)*box[3]/r.height,box[2],box[3]])};graph.onpointerup=()=>drag=null;graph.onpointercancel=()=>drag=null;graph.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.15:1/1.15)},{passive:false});new ResizeObserver(()=>draw()).observe(graph);reports();
</script></body></html>
